<p><img src="/assets/img/web_audio_osc.png" alt="Oscillator screenshot" width="500" height="255"></p>
<p>This is a simple oscillator based on the <a href="https://developer.mozilla.org/en-US/docs/Web/API/Web_Audio_API">Web Audio API</a>. The
interesting part here is mapping the linear range of the slider to the
exponential range of perceived pitch.</p>
