<p><img src="/assets/img/frets-scale-lab.png" alt="Frets scale lab showing A Dorian on the neck, labeled by scale degree" width="500" height="167"></p>
<p>Frets is a set of guitar-centric music-theory tools. It includes interactive
reference and quiz features.</p>
<p>It's a static <a href="https://nextjs.org">Next.js</a> app written in TypeScript, with the music
theory handled by <a href="https://github.com/tonaljs/tonal">Tonal</a>.</p>
